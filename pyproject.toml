[project]
name = "web-crawler"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "aioboto3>=13.2.0",
    "aiohttp>=3.11.0",
    "redis[hiredis]>=5.2.0",
    "selectolax>=0.3.27",
    "protego>=0.3.1",
    "cachetools>=5.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0"]

[tool.setuptools.packages.find]
include = ["crawler*"]
[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E = lỗi style, F = lỗi thật (biến chưa dùng, import thừa)
# I = sắp xếp import, UP = gợi ý cú pháp Python mới, B = bug thường gặp

[tool.ruff.format]
quote-style = "double"