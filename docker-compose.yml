services:
  postgres:
    image: postgres:17-alpine
    container_name: crawler-postgres
    environment:
      POSTGRES_DB: crawler
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: crawler
    ports: [ "5432:5432" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U crawler" ]
      interval: 5s
      retries: 10

  redis:
    # redis-stack has the Bloom filter module (BF.ADD / BF.RESERVE)
    image: redis/redis-stack:latest
    container_name: crawler-redis
    ports: [ "6379:6379", "8001:8001" ]

  localstack:
    image: localstack/localstack:latest
    container_name: crawler-localstack
    environment:
      SERVICES: sqs,s3
      DEBUG: 0
      LOCALSTACK_AUTH_TOKEN: ls-ZozI3488-MuRO-qeFA-HoPa-0073ZAxuaf0d
    ports: [ "4566:4566" ]
    volumes:
      - ./localstack-init.sh:/etc/localstack/init/ready.d/init.sh
